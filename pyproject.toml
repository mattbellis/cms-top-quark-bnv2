[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bnv2"
version = "0.1.0"
description = "Analysis code for the CMS |dB|=2 top quark BNV search"
requires-python = ">=3.10"
dependencies = [
    "uproot>=5.3",
    "awkward>=2.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab", "hist"]

[tool.setuptools]
packages = ["bnv2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
